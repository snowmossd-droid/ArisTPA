## Cách dùng:

1. **Commit file này** vào `.github/workflows/decompile.yml`
2. **Push DonutTP-2.2.jar** lên root của repo
3. Workflow sẽ tự chạy và tạo branch `decompiled/donuttp-2.2` chứa source code đã giải mã

Nếu vẫn gặp lỗi "Invalid or corrupt jarfile vineflower.jar", có thể do mạng chặn GitHub - hãy thử dùng mirror hoặc tự upload vineflower.jar lên repo.
