name: Decompile DonutTP-2.2.jar

on:
  workflow_dispatch:
  push:
    paths:
      - 'DonutTP-2.2.jar'

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Tải CFR thay vì Vineflower (ổn định hơn)
      - name: Tải CFR decompiler
        run: |
          echo "Đang tải CFR..."
          curl -L -o cfr.jar \
            https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          
          if [ ! -f cfr.jar ] || [ $(stat -c%s cfr.jar) -lt 1000000 ]; then
            echo "❌ Tải CFR thất bại"
            exit 1
          fi
          
          echo "✅ Đã tải CFR thành công"

      - name: Decompile với CFR
        run: |
          if [ ! -f "DonutTP-2.2.jar" ]; then
            echo "❌ Không tìm thấy DonutTP-2.2.jar"
            ls -la
            exit 1
          fi
          
          echo "Đang giải mã DonutTP-2.2.jar..."
          mkdir -p decompiled_raw
          java -jar cfr.jar DonutTP-2.2.jar --outputdir decompiled_raw/
          
          echo "✅ Giải mã thành công"
          echo "Số file Java: $(find decompiled_raw -name "*.java" | wc -l)"

      - name: Tổ chức cấu trúc Maven
        run: |
          mkdir -p src/main/java
          mkdir -p src/main/resources
          
          # Copy file Java
          find decompiled_raw -name "*.java" -exec cp --parents {} src/main/java/ \;
          
          # Copy resources
          find decompiled_raw -name "*.yml" -exec cp {} src/main/resources/ \;
          
          echo "✅ Đã tổ chức source"

      - name: Detect package
        id: detect_pkg
        run: |
          PKG=$(find src/main/java -name "*.java" | head -5 | \
                xargs grep -h "^package " 2>/dev/null | \
                head -1 | sed 's/package //;s/;//' | \
                awk -F. '{print $1"."$2}')
          
          [ -z "$PKG" ] && PKG="com.donuttp"
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "✅ Package: $PKG"

      - name: Tạo pom.xml
        run: |
          cat > pom.xml << EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                     http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${{ steps.detect_pkg.outputs.package }}</groupId>
            <artifactId>DonutTP</artifactId>
            <version>2.2-decompiled</version>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.20.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
          </project>
          EOF

      - name: Commit và push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b decompiled/donuttp-2.2 2>/dev/null || git checkout decompiled/donuttp-2.2
          git add src/ pom.xml
          git commit -m "decompile: DonutTP-2.2.jar with CFR" || echo "No changes"
          git push origin decompiled/donuttp-2.2 --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutTP-2.2-source
          path: |
            src/
            pom.xml
          retention-days: 30
